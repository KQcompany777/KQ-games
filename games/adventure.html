<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<title>KQ Adventure</title>

<style>

body{
background:#050505;
color:white;
text-align:center;
font-family:Arial;
}

h1{
color:#00ff88;
}

canvas{
background:#87ceeb;
border:3px solid #7b00ff;
}

</style>
</head>


<body>

<h1>⭐ KQ Adventure</h1>

<p>
A/D lub ⬅️➡️ ruch | Spacja lub ⬆️ skok
</p>

<h2>
Poziom: <span id="level">1</span>
⭐ <span id="score">0</span>
</h2>


<canvas id="game" width="900" height="450"></canvas>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


let keys={};

let level=0;
let score=0;
let camera=0;


let player;


let levels=[


{

platforms:[

[0,380,700,70],
[250,300,120,20],
[500,300,120,20],
[800,330,200,20],
[1100,280,150,20],
[1400,330,300,20]

],

coins:[

[300,260],
[550,260],
[850,290],
[1150,240]

],

finish:1600

},



{

platforms:[

[0,380,600,70],
[200,320,120,20],
[450,270,120,20],
[700,330,180,20],
[1000,280,150,20],
[1300,330,200,20],
[1700,280,300,20]

],

coins:[

[250,280],
[500,230],
[750,290],
[1050,240],
[1400,290]

],

finish:1850

}

];



function loadLevel(){

player={

x:100,
y:200,

w:40,
h:50,

dy:0,

speed:6,

ground:false

};


camera=0;

}



document.addEventListener("keydown",e=>{

keys[e.key]=true;

});


document.addEventListener("keyup",e=>{

keys[e.key]=false;

});




function update(){


let map=levels[level];


// ruch

if(keys["a"] || keys["ArrowLeft"])
player.x-=player.speed;


if(keys["d"] || keys["ArrowRight"])
player.x+=player.speed;



// grawitacja

player.dy+=0.6;

player.y+=player.dy;



player.ground=false;



// platformy

map.platforms.forEach(p=>{


if(

player.x < p[0]+p[2] &&

player.x+player.w > p[0] &&

player.y+player.h > p[1] &&

player.y+player.h < p[1]+20 &&

player.dy>0

){

player.y=p[1]-player.h;

player.dy=0;

player.ground=true;

}


});



// skok

if(

(keys[" "] || keys["ArrowUp"]) &&

player.ground

){

player.dy=-13;

player.ground=false;

}



// monety

map.coins.forEach(c=>{


if(!c.taken &&

player.x<c[0]+20 &&

player.x+player.w>c[0] &&

player.y<c[1]+20 &&

player.y+player.h>c[1]

){

c.taken=true;

score+=10;

}


});



// spadnięcie

if(player.y>500){

loadLevel();

}



// meta

if(player.x>map.finish){


level++;


if(level>=levels.length){

alert("🏆 KQ Adventure ukończone!");

level=0;

score=0;

}


loadLevel();

}



// kamera

camera=player.x-350;


if(camera<0)
camera=0;



draw();


requestAnimationFrame(update);


}





function draw(){


let map=levels[level];


ctx.fillStyle="#87ceeb";

ctx.fillRect(0,0,900,450);



ctx.fillStyle="#7b00ff";


map.platforms.forEach(p=>{

ctx.fillRect(

p[0]-camera,

p[1],

p[2],

p[3]

);

});



map.coins.forEach(c=>{


if(!c.taken){

ctx.fillStyle="yellow";

ctx.beginPath();

ctx.arc(
c[0]-camera,
c[1],
10,
0,
Math.PI*2
);

ctx.fill();

}

});



ctx.fillStyle="#00ff88";

ctx.fillRect(

player.x-camera,

player.y,

player.w,

player.h

);



ctx.fillStyle="white";

ctx.fillRect(

map.finish-camera,

300,

20,

80

);



document.getElementById("level").innerHTML=level+1;

document.getElementById("score").innerHTML=score;


}



loadLevel();

update();

</script>

</body>

</html>
