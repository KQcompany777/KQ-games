<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>KQ Adventure</title>

<style>
body{
background:#050505;
color:white;
text-align:center;
font-family:Arial;
}

h1{
color:#00ff88;
}

canvas{
background:#87ceeb;
border:3px solid #7b00ff;
}

</style>

</head>

<body>

<h1>⭐ KQ Adventure</h1>

<p>
⬅️➡️ ruch | ⬆️ skok
</p>

<h2>
Poziom: <span id="level">1</span>
❤️ Życia: <span id="life">3</span>
⭐ Punkty: <span id="score">0</span>
</h2>

<canvas id="game" width="800" height="400"></canvas>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


let level=1;
let lives=3;
let score=0;

let camera=0;


let player;


let keys={};


let maps=[];


// generowanie 10 poziomów

for(let i=0;i<10;i++){

maps.push({

platforms:[
{x:0,y:350,w:900+i*100,h:50},
{x:250,y:280,w:120,h:20},
{x:500,y:220,w:120,h:20},
{x:800+i*80,y:300,w:120,h:20}
],


coins:[
{x:300,y:240},
{x:550,y:180},
{x:850+i*80,y:260}
],

finish:1000+i*100

});

}



function loadLevel(){

player={
x:50,
y:250,
w:40,
h:50,
dy:0,
jump:false
};

camera=0;

}


document.addEventListener("keydown",e=>{
keys[e.key]=true;
});


document.addEventListener("keyup",e=>{
keys[e.key]=false;
});



function update(){


if(keys["ArrowRight"])
player.x+=5;


if(keys["ArrowLeft"])
player.x-=5;



if(keys["ArrowUp"] && !player.jump){

player.dy=-12;
player.jump=true;

}



player.dy+=0.5;
player.y+=player.dy;



let map=maps[level-1];



map.platforms.forEach(p=>{

if(
player.x<p.x+p.w &&
player.x+player.w>p.x &&
player.y+player.h>p.y &&
player.y+player.h<p.y+20 &&
player.dy>0
){

player.y=p.y-player.h;
player.dy=0;
player.jump=false;

}

});



map.coins.forEach(c=>{

if(!c.taken &&
player.x<c.x+20 &&
player.x+player.w>c.x &&
player.y<c.y+20 &&
player.y+player.h>c.y
){

c.taken=true;
score+=10;

}

});



// meta

if(player.x>map.finish){

level++;


if(level>10){

alert("🏆 KONIEC GRY! KQ Adventure ukończone!");

level=1;
score=0;

}


else{

alert("⭐ Poziom "+(level-1)+" ukończony!");

}


loadLevel();

}



camera=player.x-300;

if(camera<0)
camera=0;


document.getElementById("level").innerHTML=level;
document.getElementById("life").innerHTML=lives;
document.getElementById("score").innerHTML=score;


draw();


requestAnimationFrame(update);

}



function draw(){

ctx.clearRect(0,0,800,400);


ctx.fillStyle="#87ceeb";
ctx.fillRect(0,0,800,400);



let map=maps[level-1];


ctx.fillStyle="#7b00ff";

map.platforms.forEach(p=>{

ctx.fillRect(
p.x-camera,
p.y,
p.w,
p.h
);

});



map.coins.forEach(c=>{

if(!c.taken){

ctx.fillStyle="yellow";

ctx.beginPath();

ctx.arc(
c.x-camera,
c.y,
10,
0,
Math.PI*2
);

ctx.fill();

}

});



ctx.fillStyle="#00ff88";

ctx.fillRect(
player.x-camera,
player.y,
player.w,
player.h
);



ctx.fillStyle="white";

ctx.fillRect(
map.finish-camera,
250,
20,
100
);


}



loadLevel();

update();

</script>

</body>
</html>
