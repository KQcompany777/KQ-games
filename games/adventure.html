<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KQ Adventure v2</title>

<style>

body{
    background:#050505;
    color:white;
    text-align:center;
    font-family:Arial;
}

h1{
    color:#00ff88;
}

canvas{
    border:3px solid #7b00ff;
    background:#87ceeb;
}

</style>

</head>

<body>

<h1>⭐ KQ Adventure v2</h1>

<p>
⬅️ ➡️ ruch | ⬆️ skok
</p>

<canvas id="game" width="800" height="400"></canvas>

<h2>
⭐ Punkty: <span id="score">0</span>
</h2>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


// gracz

let player={
x:100,
y:250,
w:40,
h:50,
dy:0,
speed:5,
jump:false
};


// kamera

let camera=0;


// mapa

let platforms=[

{x:0,y:350,w:800,h:50},

{x:300,y:280,w:120,h:20},

{x:550,y:220,w:120,h:20},

{x:900,y:300,w:150,h:20},

{x:1200,y:250,w:150,h:20},

{x:1500,y:330,w:200,h:20}

];


// monety

let coins=[

{x:350,y:240},
{x:600,y:180},
{x:950,y:260},
{x:1250,y:210},
{x:1600,y:290}

];


let score=0;


let keys={};


document.addEventListener("keydown",e=>{
keys[e.key]=true;
});


document.addEventListener("keyup",e=>{
keys[e.key]=false;
});



function update(){


// ruch

if(keys["ArrowRight"]){
player.x+=player.speed;
}

if(keys["ArrowLeft"]){
player.x-=player.speed;
}



// skok

if(keys["ArrowUp"] && !player.jump){

player.dy=-12;
player.jump=true;

}



player.dy+=0.5;
player.y+=player.dy;



// kolizje platform

platforms.forEach(p=>{


if(
player.x < p.x+p.w &&
player.x+player.w > p.x &&
player.y+player.h > p.y &&
player.y+player.h < p.y+20 &&
player.dy>0
){

player.y=p.y-player.h;
player.dy=0;
player.jump=false;

}


});



// monety

coins.forEach(c=>{

if(
!c.taken &&
player.x<c.x+20 &&
player.x+player.w>c.x &&
player.y<c.y+20 &&
player.y+player.h>c.y
){

c.taken=true;
score+=10;

document.getElementById("score").innerHTML=score;

}

});



// kamera

camera=player.x-300;

if(camera<0)
camera=0;



draw();


requestAnimationFrame(update);

}




function draw(){


ctx.clearRect(0,0,800,400);


// niebo

ctx.fillStyle="#87ceeb";
ctx.fillRect(0,0,800,400);



// platformy

ctx.fillStyle="#7b00ff";


platforms.forEach(p=>{

ctx.fillRect(
p.x-camera,
p.y,
p.w,
p.h
);

});



// monety

coins.forEach(c=>{


if(!c.taken){

ctx.fillStyle="yellow";

ctx.beginPath();

ctx.arc(
c.x-camera,
c.y,
10,
0,
Math.PI*2
);

ctx.fill();

}


});



// gracz

ctx.fillStyle="#00ff88";

ctx.fillRect(
player.x-camera,
player.y,
player.w,
player.h
);



// meta

ctx.fillStyle="white";

ctx.fillRect(
1750-camera,
250,
20,
100
);


ctx.fillStyle="black";

ctx.font="20px Arial";

ctx.fillText(
"🏁 META",
1700-camera,
230
);


}



update();


</script>

</body>

</html>
