<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<title>KQ Adventure v4</title>

<style>

body{
    background:#050505;
    color:white;
    text-align:center;
    font-family:Arial;
}

h1{
    color:#00ff88;
}

canvas{
    background:#87ceeb;
    border:3px solid #7b00ff;
}

</style>

</head>

<body>

<h1>⭐ KQ Adventure v4</h1>

<p>
A/D lub ⬅️➡️ ruch | Spacja lub ⬆️ skok
</p>

<h2>
Poziom: <span id="level">1</span>
⭐ Punkty: <span id="score">0</span>
</h2>

<canvas id="game" width="900" height="450"></canvas>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


let keys={};

let level=0;
let score=0;


let camera=0;


let player;


let gravity=0.6;


let levels=[


{
width:2500,

platforms:[
[0,380,800,70],
[300,300,150,20],
[600,250,150,20],
[1000,320,200,20],
[1500,260,150,20],
[2000,330,300,20]
],

coins:[
[350,260],
[650,210],
[1050,280],
[1550,220]
],

finish:2200

},



{
width:3000,

platforms:[
[0,380,600,70],
[200,300,100,20],
[500,220,150,20],
[900,350,200,20],
[1300,260,200,20],
[1800,200,200,20],
[2400,330,300,20]
],

coins:[
[250,260],
[550,180],
[950,310],
[1350,220],
[1850,160]
],

finish:2600

}


];


// tutaj później dodamy poziomy 3-10


function loadLevel(){

let l=levels[level];

player={

x:100,
y:200,

w:40,
h:50,

dx:0,
dy:0,

speed:6,

ground:false

};


camera=0;

}


document.addEventListener("keydown",e=>{

keys[e.key]=true;

});


document.addEventListener("keyup",e=>{

keys[e.key]=false;

});


function update(){


let l=levels[level];


// ruch

player.dx=0;


if(keys["a"] || keys["ArrowLeft"]){

player.dx=-player.speed;

}


if(keys["d"] || keys["ArrowRight"]){

player.dx=player.speed;

}


player.x+=player.dx;



// grawitacja

player.dy+=gravity;

player.y+=player.dy;


player.ground=false;



// kolizje z platformami

l.platforms.forEach(p=>{


let x=p[0];
let y=p[1];
let w=p[2];
let h=p[3];


if(
player.x < x+w &&
player.x+player.w > x &&
player.y+player.h > y &&
player.y+player.h < y+h+15 &&
player.dy>=0
){

player.y=y-player.h;

player.dy=0;

player.ground=true;

}


});



// skok

if(
(keys[" "] || keys["ArrowUp"]) &&
player.ground
){

player.dy=-13;

player.ground=false;

}



// monety

l.coins.forEach(c=>{


if(!c.taken &&

player.x<c[0]+20 &&

player.x+player.w>c[0] &&

player.y<c[1]+20 &&

player.y+player.h>c[1]

){

c.taken=true;

score+=10;

}

});




// spadnięcie

if(player.y>600){

loadLevel();

}




// meta

if(player.x>l.finish){


level++;


if(level>=levels.length){

alert("🏆 Ukończyłeś KQ Adventure!");

level=0;

score=0;

}


loadLevel();


}




// kamera

camera=player.x-350;


if(camera<0)
camera=0;



draw();


requestAnimationFrame(update);


}



function draw(){


let l=levels[level];


ctx.clearRect(0,0,900,450);


// niebo

ctx.fillStyle="#87ceeb";

ctx.fillRect(0,0,900,450);



// platformy

ctx.fillStyle="#7b00ff";


l.platforms.forEach(p=>{


ctx.fillRect(

p[0]-camera,

p[1],

p[2],

p[3]

);


});



// monety

l.coins.forEach(c=>{


if(!c.taken){


ctx.fillStyle="yellow";


ctx.beginPath();


ctx.arc(

c[0]-camera,

c[1],

10,

0,

Math.PI*2

);


ctx.fill();


}


});



// gracz

ctx.fillStyle="#00ff88";


ctx.fillRect(

player.x-camera,

player.y,

player.w,

player.h

);



// meta

ctx.fillStyle="white";


ctx.fillRect(

l.finish-camera,

300,

20,

80

);


ctx.fillStyle="black";

ctx.fillText(
"🏁",
l.finish-camera-10,
290
);



// info

document.getElementById("level").innerHTML=level+1;

document.getElementById("score").innerHTML=score;


}



loadLevel();

update();


</script>


</body>

</html>
