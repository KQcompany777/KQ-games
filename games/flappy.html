<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<title>KQ Flappy</title>

<style>

body{
background:#050505;
color:white;
text-align:center;
font-family:Arial;
}

h1{
color:#00ff88;
}

canvas{
background:#55cfff;
border:3px solid #7b00ff;
}

</style>

</head>


<body>

<h1>🐦 KQ Flappy</h1>

<p>Kliknij albo SPACJA żeby latać</p>

<canvas id="game" width="400" height="600"></canvas>

<h2>
Punkty: <span id="score">0</span>
</h2>


<script>


const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


let bird;
let pipes;
let score;
let playing;



function start(){

bird={
x:80,
y:300,
size:25,
dy:0
};


pipes=[

{
x:450,
gap:220,
top:150
}

];


score=0;

playing=true;

}



function jump(){

if(playing){

bird.dy=-6;

}

}



document.addEventListener("keydown",e=>{

if(e.code=="Space")
jump();

});


canvas.onclick=jump;



function update(){


if(!playing)
return;



ctx.clearRect(0,0,400,600);



// fizyka

bird.dy+=0.25;

bird.y+=bird.dy;



// rury

pipes.forEach(p=>{

p.x-=2;

});



if(pipes[0].x<-60){

pipes.shift();

score++;

document.getElementById("score").innerHTML=score;

}



if(pipes.length<2){

pipes.push({

x:450,

gap:220,

top:Math.random()*180+50

});

}




// ptak

ctx.fillStyle="yellow";

ctx.fillRect(
bird.x,
bird.y,
bird.size,
bird.size
);




// rury

ctx.fillStyle="#00aa00";


pipes.forEach(p=>{


ctx.fillRect(
p.x,
0,
60,
p.top
);


ctx.fillRect(
p.x,
p.top+p.gap,
60,
600
);



// kolizja

if(

bird.x < p.x+60 &&

bird.x+bird.size > p.x &&

(

bird.y < p.top ||

bird.y+bird.size > p.top+p.gap

)

){

gameOver();

}


});



if(bird.y<0 || bird.y>600){

gameOver();

}



requestAnimationFrame(update);

}



function gameOver(){

playing=false;

setTimeout(()=>{

alert(
"Koniec gry! Wynik: "+score
);

start();

update();

},100);

}



start();

update();


</script>


</body>

</html>
