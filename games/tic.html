<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KQ Tic Tac Toe</title>

<style>

body {
    background:#050505;
    color:white;
    text-align:center;
    font-family:Arial;
}

h1 {
    color:#00ff88;
}

#board {
    display:grid;
    grid-template-columns:repeat(3,100px);
    gap:10px;
    justify-content:center;
    margin:30px;
}

.cell {
    width:100px;
    height:100px;
    background:#202020;
    border:2px solid #7b00ff;
    font-size:50px;
    cursor:pointer;
}

button {
    padding:15px 30px;
    border:0;
    border-radius:15px;
    background:#00ff88;
    cursor:pointer;
}

</style>

</head>


<body>

<h1>❌⭕ KQ Tic Tac Toe</h1>

<div id="board"></div>

<h2 id="msg"></h2>

<button onclick="restart()">Restart</button>


<script>

let board=["","","","","","","","",""];

let game=true;


const win=[
[0,1,2],
[3,4,5],
[6,7,8],
[0,3,6],
[1,4,7],
[2,5,8],
[0,4,8],
[2,4,6]
];


function draw(){

let b=document.getElementById("board");

b.innerHTML="";


board.forEach((x,i)=>{

let c=document.createElement("div");

c.className="cell";

c.innerHTML=x;

c.onclick=()=>move(i);

b.appendChild(c);

});

}



function move(i){

if(board[i]!=="" || !game)
return;


board[i]="❌";


check();


if(game)
computer();


}



function computer(){

let empty=board
.map((x,i)=>x===""?i:null)
.filter(x=>x!==null);


let move=empty[Math.floor(Math.random()*empty.length)];


board[move]="⭕";

check();

}



function check(){

for(let w of win){

let a=board[w[0]];
let b=board[w[1]];
let c=board[w[2]];


if(a && a==b && b==c){

document.getElementById("msg").innerHTML=
a+" wygrywa!";

game=false;

}

}


if(!board.includes("") && game){

document.getElementById("msg").innerHTML=
"Remis!";

game=false;

}

draw();

}



function restart(){

board=["","","","","","","","",""];

game=true;

document.getElementById("msg").innerHTML="";

draw();

}


draw();

</script>


</body>

</html>
